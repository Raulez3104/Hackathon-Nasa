<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GeoQocha: analítica socioambiental de los 15 distritos de Cochabamba con datos NASA y del GAMC." />
    <meta name="theme-color" content="#F0F7FF" />
    <link rel="icon" type="image/png" href="/brand/logo-geoqocha.png" />
    <link rel="apple-touch-icon" href="/brand/logo-geoqocha.png" />
    <title>GeoQocha · Analítica socioambiental de Cochabamba</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("geoqocha-theme");
          var theme = stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
